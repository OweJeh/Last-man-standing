<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#080808"/>
  <!-- Border -->
  <rect x="1" y="1" width="30" height="30" rx="5.5" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- 2×2 grid with 2px gap, padded 6px -->
  <!-- Top-left: white (survivor) -->
  <rect x="6"  y="6"  width="8" height="8" rx="2" fill="#FFFFFF"/>
  <!-- Top-right: eliminated gray -->
  <rect x="18" y="6"  width="8" height="8" rx="2" fill="#303030"/>
  <!-- Bottom-left: eliminated gray -->
  <rect x="6"  y="18" width="8" height="8" rx="2" fill="#303030"/>
  <!-- Bottom-right: red accent (last man standing) -->
  <rect x="18" y="18" width="8" height="8" rx="2" fill="#EF3038"/>
</svg>

